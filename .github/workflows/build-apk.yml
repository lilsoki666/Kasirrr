name: Build Kasirqu Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. Verify Java
      # ==========================================
      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "PATH=$PATH"

          echo "===== JAVA ====="
          which java
          java -version

          echo "===== JAVAC ====="
          which javac
          javac -version


      # ==========================================
      # 5. Install system dependencies
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # 6. Install Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.33


      # ==========================================
      # 7. Verify Buildozer
      # ==========================================
      - name: Verify Buildozer
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== JAVA ====="
          java -version

          echo "===== BUILDOZER ====="
          buildozer --version


      # ==========================================
      # 8. Build Android APK
      # ==========================================
      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          buildozer android debug


      # ==========================================
      # 9. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasirqu-debug-apk
          path: bin/*.apk
          if-no-files-found: error
